name: Windows CLI portable checks

on:
  push:
    paths:
      - '.github/workflows/windows-cli.yml'
      - 'tools/**'
      - 'boot/**'
      - 'cfg/**'
      - 'harness/windows_port/**'
      - 'harness/frame_capacity/**'
      - 'harness/player_constants/**'
      - 'harness/pcm_write_pacing/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.python-version-gpu'
  pull_request:
    paths:
      - '.github/workflows/windows-cli.yml'
      - 'tools/**'
      - 'boot/**'
      - 'cfg/**'
      - 'harness/windows_port/**'
      - 'harness/frame_capacity/**'
      - 'harness/player_constants/**'
      - 'harness/pcm_write_pacing/**'
      - 'Makefile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.python-version-gpu'
  workflow_dispatch:
    inputs:
      full_linux_make:
        description: Run full 16,384-frame Linux Make and same-source Windows CPU qualification
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  linux-movie-make:
    if: github.event_name == 'workflow_dispatch' && inputs.full_linux_make
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Linux movie build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg make binutils-m68k-linux-gnu
      - name: Bootstrap pinned CPU environment
        run: tools/bootstrap_python.sh --cpu
      - name: Configure native m68k binutils
        run: |
          mkdir -p tmp/ci-m68k
          for tool in as ld objcopy nm size objdump; do
            ln -s "$(command -v "m68k-linux-gnu-$tool")" "tmp/ci-m68k/m68k-elf-$tool"
          done
          echo "$PWD/tmp/ci-m68k" >> "$GITHUB_PATH"
          echo "M68K_PREFIX=/usr/bin/m68k-linux-gnu-" >> "$GITHUB_ENV"
      - name: Generate the canonical full-length source
        run: |
          tools/python.sh \
            --device cpu \
            --workspace-root "$PWD/tmp/linux-movie/workspace" \
            --scratch-root "$RUNNER_TEMP/cavc-linux-scratch" \
            --array-storage disk \
            harness/frame_capacity/make_source.py --frames 16384 \
            --profile tmp/linux-movie/profile.toml
      - name: Encode all six stages on Linux
        run: |
          tools/python.sh \
            --device cpu \
            --workspace-root "$PWD/tmp/linux-movie/workspace" \
            --scratch-root "$RUNNER_TEMP/cavc-linux-scratch" \
            --array-storage disk \
            tools/sim.py tmp/linux-movie/profile.toml
      - name: Execute Linux movie Make targets from the completed encode
        run: |
          export CBRSIM_DEVICE=cpu
          export CAVC_WORKSPACE_ROOT="$PWD/tmp/linux-movie/workspace"
          export CAVC_SCRATCH_ROOT="$RUNNER_TEMP/cavc-linux-scratch"
          export CAVC_ARRAY_STORAGE=disk
          make moviepack CONFIG=tmp/linux-movie/profile.toml
          make movieplay-module CONFIG=tmp/linux-movie/profile.toml
          make movieplay-internal CONFIG=tmp/linux-movie/profile.toml
      - name: Verify resulting ISO and CUE
        run: |
          test -s out/profile_release.iso
          test -s out/profile_release.cue
          grep -Fx 'FILE "profile_release.iso" BINARY' out/profile_release.cue
          tools/python.sh -c 'from pathlib import Path; import encode_config; from multipart_build import verify_iso; profile = encode_config.load_profile(Path("tmp/linux-movie/profile.toml")); verify_iso(Path("out/profile_release.iso"), Path(profile.disc_staging_dir)); print("Linux movie ISO independently verified")'
      - name: Prepare full-source cross-platform baseline
        run: |
          tools/python.sh --device cpu \
            --workspace-root "$PWD/tmp/linux-movie/workspace" \
            --scratch-root "$RUNNER_TEMP/cavc-linux-scratch" \
            --array-storage disk \
            harness/windows_port/prepare_cross_platform_baseline.py \
            tmp/linux-movie/profile.toml tmp/linux-movie/baseline
      - uses: actions/upload-artifact@v4
        with:
          name: linux-full-source-baseline
          path: tmp/linux-movie/baseline/
          if-no-files-found: error
          retention-days: 2

  windows-cross-platform-full:
    if: github.event_name == 'workflow_dispatch' && inputs.full_linux_make
    needs: linux-movie-make
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned FFmpeg and 7-Zip
        shell: pwsh
        run: |
          $toolsRoot = Join-Path $env:RUNNER_TEMP 'cavc-external-tools'
          New-Item -ItemType Directory -Force $toolsRoot | Out-Null
          $sevenZipInstaller = Join-Path $toolsRoot '7z2602-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/ip7z/7zip/releases/download/26.02/7z2602-x64.exe' -OutFile $sevenZipInstaller
          $sevenZipHash = (Get-FileHash -LiteralPath $sevenZipInstaller -Algorithm SHA256).Hash
          if ($sevenZipHash -ne '6745FA76DC2EA031596D8678F6F6B99C3C1B435B4164A63485ADBBC7B8D82EF0') { throw "7-Zip installer SHA-256 mismatch: $sevenZipHash" }
          $sevenZipRoot = Join-Path $toolsRoot '7-Zip'
          $sevenZipInstall = Start-Process -FilePath $sevenZipInstaller -ArgumentList @('/S', "/D=$sevenZipRoot") -Wait -PassThru
          if ($sevenZipInstall.ExitCode -ne 0) { throw "7-Zip installation failed: $($sevenZipInstall.ExitCode)" }
          $ffmpegArchive = Join-Path $toolsRoot 'ffmpeg-8.1.2-full_build.zip'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-full_build.zip' -OutFile $ffmpegArchive
          $ffmpegHash = (Get-FileHash -LiteralPath $ffmpegArchive -Algorithm SHA256).Hash
          if ($ffmpegHash -ne 'B8CDEFAB5F50590A076C27C2B56B0294A0E6154FADED28BA1BA05EBC4F801F57') { throw "FFmpeg archive SHA-256 mismatch: $ffmpegHash" }
          $ffmpegRoot = Join-Path $toolsRoot 'ffmpeg'
          Expand-Archive -LiteralPath $ffmpegArchive -DestinationPath $ffmpegRoot
          $ffmpeg = Get-ChildItem -Path $ffmpegRoot -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw 'Pinned Gyan FFmpeg archive did not contain ffmpeg.exe' }
          $ffprobe = Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'
          if (-not (Test-Path $ffprobe)) { throw 'Pinned Gyan FFmpeg package did not install ffprobe.exe' }
          $ffmpegVersion = (& $ffmpeg.FullName -version | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or $ffmpegVersion -notmatch '^ffmpeg version 8\.1\.2') { throw "Unexpected FFmpeg version: $ffmpegVersion" }
          $ffprobeVersion = (& $ffprobe -version | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or $ffprobeVersion -notmatch '^ffprobe version 8\.1\.2') { throw "Unexpected FFprobe version: $ffprobeVersion" }
          $ffmpeg.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $sevenZipRoot | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Bootstrap pinned CPU environment
        shell: pwsh
        run: .\tools\bootstrap_python.ps1 --cpu
      - name: Install pinned native m68k tools
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'cavc-m68k'
          .\harness\windows_port\install_sgdk_tools.ps1 -InstallDirectory $install
          $prefix = (Join-Path $install 'bin/m68k-elf-')
          "M68K_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/download-artifact@v4
        with:
          name: linux-full-source-baseline
          path: tmp/windows-cross-platform/baseline
      - name: Encode and compare the exact Linux source on Windows CPU
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP 'cavc-cross-platform/workspace'
          $scratch = Join-Path $env:RUNNER_TEMP 'cavc-cross-platform/scratch'
          New-Item -ItemType Directory -Force $workspace, $scratch | Out-Null
          $source = (Resolve-Path 'tmp/windows-cross-platform/baseline/source.mp4').Path
          .\tools\python.ps1 --workspace-root $workspace --scratch-root $scratch --array-storage disk harness/frame_capacity/make_source.py --frames 16384 --existing-source $source --profile tmp/windows-cross-platform/profile.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tools\cavc.ps1 --workspace-root $workspace --scratch-root $scratch --array-storage disk convert tmp/windows-cross-platform/profile.toml --device cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidateData = (& .\tools\python.ps1 --workspace-root $workspace --scratch-root $scratch --array-storage disk --device cpu -c 'from pathlib import Path; import encode_config,sys; print(encode_config.load_profile(Path(sys.argv[1])).output_dir)' tmp/windows-cross-platform/profile.toml | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidateBuild = (& .\tools\python.ps1 --workspace-root $workspace --scratch-root $scratch --array-storage disk --device cpu -c 'from pathlib import Path; import encode_config,sys; print(encode_config.load_profile(Path(sys.argv[1])).build_dir)' tmp/windows-cross-platform/profile.toml | Select-Object -Last 1).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tools\python.ps1 harness/windows_port/compare_normalized_source.py $source $source --ffmpeg ffmpeg --ffprobe ffprobe --tsv logs/windows-full-source-normalized.tsv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tools\python.ps1 harness/windows_port/compare_cross_platform.py tmp/windows-cross-platform/baseline $candidateData out/profile $candidateBuild $source logs/windows-full-source-normalized.tsv --tsv logs/windows-full-cross-platform.tsv --decisions-tsv logs/windows-full-cross-platform-decisions.tsv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-full-cross-platform-comparison
          path: |
            logs/windows-full-source-normalized.tsv
            logs/windows-full-cross-platform.tsv
            logs/windows-full-cross-platform-decisions.tsv
            logs/windows-cli-encode-*.json
            logs/windows-cli-disc-*.json
          if-no-files-found: error
          retention-days: 2

  linux-build-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install GNU Make and native m68k binutils
        run: |
          sudo apt-get update
          sudo apt-get install --yes make binutils-m68k-linux-gnu
      - name: Bootstrap pinned CPU environment
        run: tools/bootstrap_python.sh --cpu
      - name: Configure m68k tools for legacy Make and player matrix
        run: |
          mkdir -p tmp/ci-m68k
          for tool in as ld objcopy nm size objdump; do
            ln -s "$(command -v "m68k-linux-gnu-$tool")" "tmp/ci-m68k/m68k-elf-$tool"
          done
          echo "$PWD/tmp/ci-m68k" >> "$GITHUB_PATH"
          echo "M68K_PREFIX=/usr/bin/m68k-linux-gnu-" >> "$GITHUB_ENV"
      - name: Execute Linux Make toolchain contract
        run: make check-player-tools CONFIG=profiles/tears-of-steel.toml
      - name: Build generic and specialized player matrix
        run: tools/python.sh harness/player_constants/verify.py
      - name: Check cross-platform Windows port contracts
        run: tools/python.sh -m unittest discover -s harness/windows_port -p 'test_*.py'
      - name: Check Linux resource, profile, process and cache contracts
        run: |
          tools/python.sh -m unittest discover -s tools -p test_resource_tokens.py
          tools/python.sh -m unittest discover -s tools -p test_encode_config.py
          tools/python.sh -m unittest discover -s tools -p test_parallel_run.py
          tools/python.sh -m unittest discover -s tools -p test_sim_multiprocessing.py
          tools/python.sh -m unittest discover -s tools -p test_sim_artifact_cache.py
          tools/python.sh -m unittest discover -s tools -p test_tmpfs_workspace.py

  cpu-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.29'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Bootstrap pinned CPU environment
        shell: pwsh
        run: .\tools\bootstrap_python.ps1 --cpu
      - name: Install pinned FFmpeg and 7-Zip
        shell: pwsh
        run: |
          $toolsRoot = Join-Path $env:RUNNER_TEMP 'cavc-external-tools'
          New-Item -ItemType Directory -Force $toolsRoot | Out-Null
          $sevenZipInstaller = Join-Path $toolsRoot '7z2602-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/ip7z/7zip/releases/download/26.02/7z2602-x64.exe' -OutFile $sevenZipInstaller
          $sevenZipHash = (Get-FileHash -LiteralPath $sevenZipInstaller -Algorithm SHA256).Hash
          if ($sevenZipHash -ne '6745FA76DC2EA031596D8678F6F6B99C3C1B435B4164A63485ADBBC7B8D82EF0') { throw "7-Zip installer SHA-256 mismatch: $sevenZipHash" }
          $sevenZipRoot = Join-Path $toolsRoot '7-Zip'
          $sevenZipInstall = Start-Process -FilePath $sevenZipInstaller -ArgumentList @('/S', "/D=$sevenZipRoot") -Wait -PassThru
          if ($sevenZipInstall.ExitCode -ne 0) { throw "7-Zip installation failed: $($sevenZipInstall.ExitCode)" }
          $ffmpegArchive = Join-Path $toolsRoot 'ffmpeg-8.1.2-full_build.zip'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-full_build.zip' -OutFile $ffmpegArchive
          $ffmpegHash = (Get-FileHash -LiteralPath $ffmpegArchive -Algorithm SHA256).Hash
          if ($ffmpegHash -ne 'B8CDEFAB5F50590A076C27C2B56B0294A0E6154FADED28BA1BA05EBC4F801F57') { throw "FFmpeg archive SHA-256 mismatch: $ffmpegHash" }
          $ffmpegRoot = Join-Path $toolsRoot 'ffmpeg'
          Expand-Archive -LiteralPath $ffmpegArchive -DestinationPath $ffmpegRoot
          $ffmpeg = Get-ChildItem -Path $ffmpegRoot -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw 'Pinned Gyan FFmpeg archive did not contain ffmpeg.exe' }
          $ffprobe = Join-Path $ffmpeg.DirectoryName 'ffprobe.exe'
          if (-not (Test-Path $ffprobe)) { throw 'Pinned Gyan FFmpeg package did not install ffprobe.exe' }
          $ffmpegVersion = (& $ffmpeg.FullName -version | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or $ffmpegVersion -notmatch '^ffmpeg version 8\.1\.2') { throw "Unexpected FFmpeg version: $ffmpegVersion" }
          $ffprobeVersion = (& $ffprobe -version | Select-Object -First 1)
          if ($LASTEXITCODE -ne 0 -or $ffprobeVersion -notmatch '^ffprobe version 8\.1\.2') { throw "Unexpected FFprobe version: $ffprobeVersion" }
          $ffmpeg.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $sevenZipRoot | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Check bootstrap preserves the caller environment
        shell: pwsh
        run: |
          $previous = [Environment]::GetEnvironmentVariable('UV_PROJECT_ENVIRONMENT', 'Process')
          try {
            $env:UV_PROJECT_ENVIRONMENT = 'caller-sentinel'
            $isolated = Join-Path $env:RUNNER_TEMP 'cavc-bootstrap-isolation'
            .\tools\bootstrap_python.ps1 --cpu -EnvironmentRoot $isolated
            if ($LASTEXITCODE -ne 0) { throw "Bootstrap check failed: $LASTEXITCODE" }
            if ($env:UV_PROJECT_ENVIRONMENT -ne 'caller-sentinel') {
              throw 'Bootstrap leaked UV_PROJECT_ENVIRONMENT into the calling PowerShell session'
            }
          } finally {
            if ($null -eq $previous) {
              Remove-Item Env:UV_PROJECT_ENVIRONMENT -ErrorAction SilentlyContinue
            } else {
              [Environment]::SetEnvironmentVariable('UV_PROJECT_ENVIRONMENT', $previous, 'Process')
            }
          }
      - name: Install pinned native m68k tools
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'cavc-m68k'
          .\harness\windows_port\install_sgdk_tools.ps1 -InstallDirectory $install
          $prefix = (Join-Path $install 'bin/m68k-elf-')
          "M68K_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check Windows ISO and lock contracts
        shell: pwsh
        run: .\tools\python.ps1 -m unittest discover -s harness/windows_port -p 'test_*.py'
      - name: Check parallel stage selection
        shell: pwsh
        run: .\tools\python.ps1 -m unittest discover -s tools -p test_parallel_run.py
      - name: Check resource tokens and output locks
        shell: pwsh
        run: .\tools\python.ps1 -m unittest discover -s tools -p test_resource_tokens.py
      - name: Check profile parsing and Windows artifact names
        shell: pwsh
        run: .\tools\python.ps1 -m unittest discover -s tools -p test_encode_config.py
      - name: Check Windows spawn selection and authenticated sim reuse
        shell: pwsh
        run: |
          .\tools\python.ps1 -m unittest discover -s tools -p test_sim_multiprocessing.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tools\python.ps1 -m unittest discover -s tools -p test_sim_artifact_cache.py
      - name: Check workspace leases and eviction
        shell: pwsh
        run: .\tools\python.ps1 -m unittest discover -s tools -p test_tmpfs_workspace.py
      - name: Assemble real Sub extension with native m68k tools
        shell: pwsh
        run: .\tools\python.ps1 harness/windows_port/assemble_extension.py
      - name: Encode and build a short DEBUG US movie natively
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP 'cavc-windows-smoke/workspace'
          $scratch = Join-Path $env:RUNNER_TEMP 'cavc-windows-smoke/scratch'
          New-Item -ItemType Directory -Force $workspace, $scratch | Out-Null
          .\tools\python.ps1 --workspace-root $workspace --scratch-root $scratch --array-storage disk harness/frame_capacity/make_source.py --frames 48 --profile tmp/windows-ci-smoke/profile.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tools\cavc.ps1 --workspace-root $workspace --scratch-root $scratch --array-storage disk convert tmp/windows-ci-smoke/profile.toml --device cpu --debug --region us
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'out/profile_us.iso')) { throw 'Native CLI did not create the DEBUG US ISO' }
          if (-not (Test-Path 'out/profile_us.cue')) { throw 'Native CLI did not create the DEBUG US CUE' }
          if ((Get-Content 'out/profile_us.cue' -TotalCount 1) -ne 'FILE "profile_us.iso" BINARY') { throw 'DEBUG US CUE references an unexpected image' }
          .\tools\python.ps1 -c 'from pathlib import Path; import encode_config; from multipart_build import verify_iso; profile = encode_config.load_profile(Path("tmp/windows-ci-smoke/profile.toml")); verify_iso(Path("out/profile_us.iso"), Path(profile.disc_staging_dir)); print("Windows CLI smoke ISO independently verified")'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tools\cavc.ps1 --workspace-root $workspace --scratch-root $scratch --array-storage disk multipart tmp/windows-ci-smoke/profile.toml --parts 2 --part 1 --device cpu
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $part2Output = .\tools\cavc.ps1 --workspace-root $workspace --scratch-root $scratch --array-storage disk multipart tmp/windows-ci-smoke/profile.toml --parts 2 --part 2 --device cpu 2>&1
          $part2Exit = $LASTEXITCODE
          $part2Text = $part2Output -join "`n"
          $part2Output
          if ($part2Exit -ne 0) { exit $part2Exit }
          if ($part2Text -notmatch 'part 1/2: verified completed part reused') { throw 'Second multipart invocation did not reuse the authenticated first part' }
          $multipartFolder = Get-ChildItem out -Directory -Filter 'profile-multipart2-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $multipartFolder) { throw 'CPU multipart conversion did not create its output folder' }
          $manifestPath = Join-Path $multipartFolder.FullName 'multipart_release.json'
          $multipart = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $staged = Join-Path $PWD "tmp/$($multipart.stem)/disc"
          .\tools\python.ps1 -c 'import json,sys; from pathlib import Path; import multipart_build; iso,cue,record,staged=map(Path,sys.argv[1:]); manifest=json.loads(record.read_text(encoding="utf-8")); assert manifest["parts"] == 2; assert [item["range"] for item in manifest["items"]] == [[0,24],[24,48]]; multipart_build.verify_iso(iso,staged); assert cue.read_text(encoding="utf-8").splitlines()[0] == f"FILE \"{iso.name}\" BINARY"; print("Windows CPU multipart ISO independently verified")' $multipart.iso $multipart.cue $manifestPath $staged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assemble player matrix with native m68k tools
        shell: pwsh
        run: |
          $bin = Split-Path $env:M68K_PREFIX
          $env:PATH = "$bin;$env:PATH"
          .\tools\python.ps1 harness/player_constants/verify.py
      - name: Parse native PowerShell entrypoints
        shell: pwsh
        run: |
          $files = @('tools/python.ps1', 'tools/python_args.ps1', 'tools/bootstrap_python.ps1', 'tools/cavc.ps1', 'tools/test_python_args.ps1', 'harness/windows_port/install_uv.ps1', 'harness/windows_port/install_sgdk_tools.ps1', 'harness/windows_port/measure_windows_run.ps1', 'harness/windows_port/measure_gpu.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$file`: $($errors -join '; ')" }
          }
          .\tools\test_python_args.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tools\python.ps1 harness/windows_port/test_python_launcher_cancel.py
